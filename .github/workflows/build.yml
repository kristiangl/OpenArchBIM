name: build

# Tests run on every push to main and every pull request (Linux only, quick).
# The Windows and Mac installers are only built for a release: push a tag like v0.3.0,
# or run this workflow by hand from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run --release -p openarch-links --example masterplan

  app:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri CLI
        working-directory: apps/desktop
        run: npm ci
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx tauri build
      # Ad-hoc signature ("-") so Apple Silicon will run the app. It is still
      # not notarized, so a browser-downloaded dmg needs the quarantine flag
      # cleared once (see README).
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: openarch-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
