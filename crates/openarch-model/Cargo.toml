[package]
name = "openarch-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Building model: elements, transactions, undo/redo, geometry, project file"

[dependencies]
openarch-params = { path = "../openarch-params" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
i_overlay = "9.0.1"
earcutr = "0.5.0"
