[package]
name = "openarch-rfa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Revit family files (.rfa) read into OpenArch families"

[dependencies]
serde_json = "1"
openarch-model = { path = "../openarch-model" }
# Apache-2.0, a clean-room reader of Revit files, used unmodified as a separate library (THIRD-PARTY-NOTICES.md).
# Its research modules (the record framing, the form records and the saved display meshes) sit outside its semver
# promise, so it is pinned to one commit.
rvt = { git = "https://github.com/DrunkOnJava/rvt-rs", rev = "62cc17e0d8bc8781cfab482ca50e8216e0a3ce1d", default-features = false, features = ["unstable-research"] }
