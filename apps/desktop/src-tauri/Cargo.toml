[package]
name = "openarch-desktop"
version = "0.0.1"
edition = "2021"
description = "OpenArch BIM desktop shell"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
openarch-api = { path = "../../../crates/openarch-api" }

[profile.release]
lto = "thin"
codegen-units = 1
